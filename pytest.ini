; tells pytest where tests live 
; and registering markers means you can run pytest -m smoke and avoid warnings about unknown markers

[pytest]
pythonpath = .
testpaths = automation
addopts = -v --tb=short --screenshot=only-on-failure --tracing=retain-on-failure --output=reports/test-results
markers =
    smoke: quick checks of critical functionality
    regression: full regression suite
    api: API layer tests
    ui: UI layer tests
    db: database validation tests